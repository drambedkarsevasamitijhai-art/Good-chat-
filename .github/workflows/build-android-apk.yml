name: Build Good Chat Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Hosted Good Chat Backend URL for AI Voice Assistant (optional)"
        required: false
        default: "https://ais-pre-flj6rueiohzsnor2wpluv5-637593678152.asia-southeast1.run.app"
      version_name:
        description: "Android App Version Name (e.g. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Good Chat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Good Chat Web Bundle
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.GOODCHAT_API_URL || 'https://ais-pre-flj6rueiohzsnor2wpluv5-637593678152.asia-southeast1.run.app' }}
        run: npm run build

      - name: Prepare Capacitor Android Project & App Icons
        env:
          ANDROID_VERSION_NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
        run: node scripts/prepare-android-apk.mjs

      - name: Compile Installable Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Decode Release Keystore & Compile Signed Release APK (Optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/android/app/goodchat-release.keystore"
          cd android
          GOODCHAT_KEYSTORE_PATH="${{ github.workspace }}/android/app/goodchat-release.keystore" ./gradlew assembleRelease --no-daemon

      - name: Collect Built APKs
        run: |
          mkdir -p release-apks
          VERSION_TAG="${{ inputs.version_name || format('1.0.{0}', github.run_number) }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apks/GoodChat-v${VERSION_TAG}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apks/GoodChat-latest.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-apks/GoodChat-v${VERSION_TAG}-release-signed.apk"
          fi
          ls -lh release-apks

      - name: Upload APK Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoodChat-Android-APK-${{ github.run_number }}
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Good Chat Android APK (Build #${{ github.run_number }})
          body: |
            Automated Android APK build for **Good Chat** (Build `#${{ github.run_number }}`).

            ### How to Install on Android
            1. Download **`GoodChat-latest.apk`** (or the signed release APK if configured) from Assets below.
            2. Open the downloaded `.apk` file on your Android phone.
            3. Allow **"Install unknown apps"** if prompted, then tap **Install**.
          files: release-apks/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
